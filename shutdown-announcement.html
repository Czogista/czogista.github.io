<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Shutdown Notice | Maleka DEV</title>
    <link rel="stylesheet" href="style.css">
    <script src="shutdown.js"></script>
</head>
<body>
    <div class="background-container">
        <div class="stars"></div>
        <div class="floating-particles"></div>
        <div class="gradient-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <main class="main-container shutdown-announcement">
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>Website Shutdown</h1>
                    <p class="hero-description">This website is no longer available as of 7 May 2027.</p>
                    <p class="shutdown-reminder">If you want to visit the website, include the password.</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
